# Full v0.9.8 controller-test profile using the 234-item per-character club pool.
#
# Optional check groups supply enough locations for every current randomized
# category to fit, with the remaining spaces filled by Mulligans.
# Their result readers remain capture-dependent, so this profile is intended
# for generation/integration testing until those hooks are calibrated.

description: Complete MGTT profile with clubs shuffled separately for every native and Advance Tour golfer
name: Player
game: "Mario Golf: Toadstool Tour"

"Mario Golf: Toadstool Tour":
  progression_balancing: 50
  accessibility: items
  starting_characters: 1
  shuffle_characters: true
  shuffle_star_characters: true
  shuffle_clubs: per_character
  shuffle_custom_club_sets: true
  shuffle_advance_tour_golfers: true
  advance_tour_golfer_stats: standard
  shuffle_tournaments: true
  starting_tournaments: 1
  shuffle_modes: true
  starting_modes: 3
  shuffle_power_shots: true
  # Applies only to Tournament, Star Tournament, and Stroke Play (1-9).
  starting_power_shot_capacity: 1
  shuffle_short_game: true
  # Per-character clubs plus per-character spins already use nearly every
  # active location. Use the dedicated putter example to test that extra pool.
  putter_range_scope: global
  shuffle_putting_practice_difficulties: true
  spin_unlocks: per_character
  tournament_character_checks: true
  character_match_course_checks: true
  character_match_course_access: follow_tournament_items
  ring_shot_player_counts: all_player_counts
  individual_best_badge_checks: true
  coin_shoot_checks: true
  speed_golf_checks: true
  practice_challenge_checks: true
  congo_canopy_score_checks: true
  congo_canopy_score_to_par: 0
  near_pin_aggregate_feet: 300
  # Password-dependent Part D checks are deferred until after 1.0.
  experimental_checks: false
  native_popup_delivery: client_only
  enable_debug_commands: true
  goal: all_three
